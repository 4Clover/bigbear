# Local development services
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: grizzly-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: grizzly_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d grizzly_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Local Redis for rate limiting (instead of Upstash)
  # Uncomment if you want fully offline development
  # redis:
  #   image: redis:7-alpine
  #   container_name: grizzly-redis
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:
